name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright's `reuseExistingServer` is disabled on CI, so pick a port that
  # nothing else on the runner is holding.
  PLAYGROUND_PORT: 5399

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Assert "use client" survives the build
        run: |
          for f in packages/tour/dist/react.js packages/tour/dist/react.mjs; do
            head -1 "$f" | grep -q 'use client' \
              || { echo "::error::$f is missing the \"use client\" directive"; exit 1; }
          done
          for f in packages/tour/dist/index.js packages/tour/dist/index.mjs; do
            head -1 "$f" | grep -q 'use client' \
              && { echo "::error::$f must not be a client module"; exit 1; }
          done
          echo "directives OK"

      - name: Verify publishable contents
        run: pnpm --filter @inklu/tour exec npm pack --dry-run

      - name: Verify the agent skill is discoverable via skills.sh
        run: |
          for f in skills/inklu-tour/SKILL.md \
                   skills/inklu-tour/references/api.md \
                   skills/inklu-tour/references/recipes.md; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # The real installer, not a hand-rolled check: `skills add --list`
          # parses SKILL.md frontmatter and lists what it finds. This is what
          # `npx skills add nkurunziza-saddy/inklu-tour` will see once pushed.
          npx --yes skills add . --list 2>&1 | tee /tmp/skills-list.txt
          grep -q 'inklu-tour' /tmp/skills-list.txt \
            || { echo "::error::skills CLI did not discover the inklu-tour skill"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @inklu/tour build

      - name: Install Playwright browsers
        run: pnpm --filter playground exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/playground/playwright-report/
          retention-days: 7
